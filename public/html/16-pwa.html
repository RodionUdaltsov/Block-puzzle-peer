  <!-- PWA: installable on phone & desktop -->
  <div id="pwaInstallBar" class="pwa-install-bar" hidden aria-live="polite">
    <span class="pwa-install-text">Установить игру на устройство</span>
    <button type="button" id="btnPwaInstall" class="pwa-install-btn">Установить</button>
    <button type="button" id="btnPwaInstallDismiss" class="pwa-install-dismiss" aria-label="Закрыть">×</button>
  </div>
  <script>
  (function () {
    'use strict';
    // Service Worker — automatic updates for installed / PWA
    if ('serviceWorker' in navigator) {
      var _swRefreshing = false;
      // When a new SW takes control, reload so the user gets the new assets
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_swRefreshing) return;
        _swRefreshing = true;
        try { window.location.reload(); } catch (_) {}
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).then(function (reg) {
          try {
            // Check for updates immediately and periodically
            try { reg.update(); } catch (_) {}
            setInterval(function () {
              try { reg.update(); } catch (_) {}
            }, 60 * 60 * 1000); // every hour
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  try { nw.postMessage({ type: 'SKIP_WAITING' }); } catch (_) {}
                }
              });
            });
          } catch (_) {}
        }).catch(function () {});
      });
    }
    // Install prompt (Chrome / Edge / Android)
    var deferred = null;
    var bar = document.getElementById('pwaInstallBar');
    var btn = document.getElementById('btnPwaInstall');
    var dismiss = document.getElementById('btnPwaInstallDismiss');
    function isStandalone() {
      try {
        return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
      } catch (_) { return false; }
    }
    function hideBar() {
      if (bar) { bar.hidden = true; bar.classList.remove('visible'); }
    }
    function showBar() {
      if (!bar || isStandalone()) return;
      try {
        if (localStorage.getItem('bp_pwa_dismiss') === '1') return;
      } catch (_) {}
      bar.hidden = false;
      bar.classList.add('visible');
    }
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      showBar();
    });
    window.addEventListener('appinstalled', function () {
      deferred = null;
      hideBar();
      try { localStorage.setItem('bp_pwa_dismiss', '1'); } catch (_) {}
    });
    if (btn) {
      btn.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.then(function () {
          deferred = null;
          hideBar();
        }).catch(function () { hideBar(); });
      });
    }
    if (dismiss) {
      dismiss.addEventListener('click', function () {
        hideBar();
        try { localStorage.setItem('bp_pwa_dismiss', '1'); } catch (_) {}
      });
    }
    // iOS: cannot programmatic install — show gentle tip once
    try {
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS && !isStandalone() && !localStorage.getItem('bp_pwa_ios_tip')) {
        setTimeout(function () {
          if (typeof showInfoToast === 'function') {
            showInfoToast('Установка', 'На iPhone: «Поделиться» → «На экран Домой»', 'info');
            localStorage.setItem('bp_pwa_ios_tip', '1');
          }
        }, 2500);
      }
    } catch (_) {}
  })();
  </script>
</body>

</html>
