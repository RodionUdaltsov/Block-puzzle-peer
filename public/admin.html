<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Block Puzzle — Admin DB</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --card:#141c2e; --line:#243049; --text:#e8eefc; --muted:#9aa8c7; --accent:#6ea8fe; --danger:#ff6b7a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    h1 { font-size: 1.1rem; margin: 0; }
    input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 12px; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.primary { background: var(--accent); color: #041018; border-color: transparent; font-weight: 700; }
    button.danger { background: var(--danger); color: #1a0508; border-color: transparent; font-weight: 700; }
    main { padding: 16px 20px 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; margin-bottom: 16px; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .tools input[type=search] { flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-all; }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
    tr.hidden { display: none; }
    .muted { color: var(--muted); }
    code { font-size: 0.78rem; }
    .err { color: var(--danger); }
    .ok { color: #7dffb3; }
    .dev-list { display: flex; flex-direction: column; gap: 4px; max-width: 280px; }
  </style>
</head>
<body>
  <header>
    <h1>Admin · PostgreSQL</h1>
    <label class="muted">Ключ <input id="key" type="password" value="localdev" size="12" autocomplete="off" /></label>
    <button type="button" class="primary" id="btnLoad">Обновить</button>
    <button type="button" class="danger" id="btnWipe">Удалить все аккаунты</button>
    <span id="status" class="muted"></span>
  </header>
  <main>
    <section class="card">
      <div class="tools">
        <strong>Аккаунты</strong>
        <span id="accCount" class="muted"></span>
        <input type="search" id="search" placeholder="Поиск: id, login, nick, код, device, гость…" />
      </div>
      <div id="accounts"></div>
    </section>
    <section class="card">
      <div class="tools">
        <strong>Устройства без живого аккаунта</strong>
        <span id="devCount" class="muted"></span>
        <span class="muted">(гость / после удаления аккаунта)</span>
      </div>
      <div id="devices"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let _accounts = [];
    let _devices = [];
    function key() { return ($('key').value || 'localdev').trim(); }
    function setStatus(msg, ok) {
      const el = $('status');
      el.textContent = msg || '';
      el.className = ok === false ? 'err' : (ok ? 'ok' : 'muted');
    }
    async function api(path, opts) {
      opts = opts || {};
      const k = key();
      const url = path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(k);
      const res = await fetch(url, {
        method: opts.method || 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: opts.body ? JSON.stringify(Object.assign({ key: k }, opts.body)) : undefined,
        credentials: 'same-origin'
      });
      let data = {};
      try { data = await res.json(); } catch (_) { data = {}; }
      return { res, data };
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function renderAccounts(list) {
      if (!list.length) {
        $('accounts').innerHTML = '<p class="muted">Нет аккаунтов</p>';
        $('accCount').textContent = '(0)';
        return;
      }
      $('accCount').textContent = '(' + list.length + ')';
      $('accounts').innerHTML =
        '<table><thead><tr>' +
        '<th>login</th><th>nick</th><th>код друга</th><th>account id</th><th>device id</th><th>🏆</th><th>💎</th><th>best</th><th></th>' +
        '</tr></thead><tbody>' +
        list.map((a) => {
          const devs = Array.isArray(a.device_ids) ? a.device_ids : [];
          const searchBlob = [a.id, a.login, a.nick, a.friend_code, ...(devs)].join(' ').toLowerCase();
          const devHtml = devs.length
            ? ('<div class="dev-list">' + devs.map((d) => '<code>' + esc(d) + '</code>').join('') + '</div>')
            : '<span class="muted">—</span>';
          return '<tr data-search="' + esc(searchBlob) + '">' +
            '<td><code>' + esc(a.login) + '</code></td>' +
            '<td>' + esc(a.nick) + '</td>' +
            '<td><code>' + esc(a.friend_code) + '</code></td>' +
            '<td><code>' + esc(a.id) + '</code></td>' +
            '<td>' + devHtml + '</td>' +
            '<td>' + (a.trophies|0) + '</td>' +
            '<td>' + (a.diamonds|0) + '</td>' +
            '<td>' + (a.best|0) + '</td>' +
            '<td><button type="button" class="danger" data-del-acc="' + esc(a.id) + '">Удалить</button></td>' +
            '</tr>';
        }).join('') + '</tbody></table>';
    }
    function guestCodeFrom(d) {
      try {
        const gp = d && d.guest_progress;
        if (gp && gp.friendCode) return String(gp.friendCode).toUpperCase();
      } catch (_) {}
      return '';
    }
    function guestNickFrom(d) {
      try {
        const gp = d && d.guest_progress;
        if (gp && gp.nick) return String(gp.nick);
      } catch (_) {}
      return '';
    }
    function renderOrphanDevices(devices) {
      const orphans = (devices || []).filter((d) => {
        const ids = Array.isArray(d.account_ids) ? d.account_ids : [];
        const hasReal = ids.some((x) => x && x !== '__guest__' && x !== '__had_account__');
        return !hasReal;
      });
      $('devCount').textContent = '(' + orphans.length + ')';
      if (!orphans.length) {
        $('devices').innerHTML = '<p class="muted">Нет</p>';
        return;
      }
      $('devices').innerHTML =
        '<table><thead><tr><th>device id</th><th>код друга</th><th>ник</th><th>💎</th><th>метки</th><th>updated</th><th></th></tr></thead><tbody>' +
        orphans.map((d) => {
          const ids = Array.isArray(d.account_ids) ? d.account_ids : [];
          const gp = d.guest_progress && typeof d.guest_progress === 'object' ? d.guest_progress : null;
          const code = guestCodeFrom(d);
          const nick = guestNickFrom(d);
          const dia = gp && typeof gp.diamonds === 'number' ? (gp.diamonds|0) : '—';
          const searchBlob = [d.device_id, code, nick, JSON.stringify(ids)].join(' ').toLowerCase();
          return '<tr data-search="' + esc(searchBlob) + '">' +
            '<td><code>' + esc(d.device_id) + '</code></td>' +
            '<td><code>' + esc(code || '—') + '</code></td>' +
            '<td>' + esc(nick || '—') + '</td>' +
            '<td>' + dia + '</td>' +
            '<td><code>' + esc(JSON.stringify(ids)) + '</code></td>' +
            '<td class="muted">' + (d.updated_at ? new Date(Number(d.updated_at)).toLocaleString() : '') + '</td>' +
            '<td><button type="button" class="danger" data-del-dev="' + esc(d.device_id) + '">Удалить гостя</button></td>' +
            '</tr>';
        }).join('') + '</tbody></table>';
    }
    function applySearch() {
      const q = String(($('search').value || '')).trim().toLowerCase();
      document.querySelectorAll('#accounts tbody tr, #devices tbody tr').forEach((tr) => {
        const blob = tr.getAttribute('data-search') || '';
        tr.classList.toggle('hidden', !!(q && blob.indexOf(q) === -1));
      });
    }
    async function load() {
      setStatus('Загрузка…');
      const { res, data } = await api('/api/admin/overview');
      if (!res.ok || !data.ok) {
        setStatus((data && (data.message || data.error)) || ('Ошибка ' + res.status), false);
        return;
      }
      _accounts = data.accounts || [];
      _devices = data.devices || [];
      renderAccounts(_accounts);
      renderOrphanDevices(_devices);
      applySearch();
      setStatus('OK · ' + new Date().toLocaleTimeString(), true);
    }
    $('btnLoad').onclick = () => load().catch((e) => setStatus(String(e), false));
    $('search').oninput = applySearch;
    $('btnWipe').onclick = async () => {
      if (!confirm('Удалить ВСЕ аккаунты? Устройства, где был аккаунт, останутся без права на нового гостя.')) return;
      if (!confirm('Точно удалить все аккаунты?')) return;
      const { res, data } = await api('/api/admin/delete-all-accounts', { method: 'POST', body: {} });
      setStatus((data && data.message) || (res.ok ? 'Готово' : 'Ошибка'), !!res.ok);
      await load();
    };
    document.body.addEventListener('click', async (e) => {
      const t = e.target;
      if (!t || !t.getAttribute) return;
      const acc = t.getAttribute('data-del-acc');
      const dev = t.getAttribute('data-del-dev');
      if (acc) {
        e.preventDefault();
        e.stopPropagation();
        if (!confirm('Удалить аккаунт?\n' + acc + '\n\nВсе устройства этого аккаунта: только вход/регистрация, без «Играть гостем».')) return;
        t.disabled = true;
        try {
          const { res, data } = await api('/api/admin/delete-account', { method: 'POST', body: { id: acc } });
          if (!res.ok || !data.ok) {
            setStatus((data && (data.message || data.error)) || ('Ошибка ' + res.status), false);
            t.disabled = false;
            return;
          }
          setStatus('Аккаунт удалён: ' + acc, true);
          await load();
        } catch (err) {
          setStatus(String(err), false);
          t.disabled = false;
        }
      }
      if (dev) {
        e.preventDefault();
        if (!confirm('Удалить гостя устройства?\nПосле этого можно снова создать гостя.')) return;
        t.disabled = true;
        await api('/api/admin/delete-device', { method: 'POST', body: { deviceId: dev } });
        await load();
      }
    });
    load().catch((e) => setStatus(String(e), false));
  </script>
</body>
</html>
