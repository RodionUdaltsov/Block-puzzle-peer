# Production-oriented: PostgreSQL is the source of truth for player progress.
#
#   docker compose up -d --build
#
# Set BP_ADMIN_KEY (admin API is disabled without it), BP_TRUST_PROXY (=1 behind
# nginx/Caddy) and BP_WS_ORIGINS for a real deployment.
#
services:
  app:
    build: .
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      NODE_ENV: ${NODE_ENV:-production}
      BP_STORE: ${BP_STORE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://bp:bp@postgres:5432/blockpuzzle}
      BP_WS_ORIGINS: ${BP_WS_ORIGINS:-}
      BP_ADMIN_KEY: ${BP_ADMIN_KEY:-}
      BP_TRUST_PROXY: ${BP_TRUST_PROXY:-0}
      BP_LOG: ${BP_LOG:-info}
    volumes:
      - bp-data:/app/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bp}
      POSTGRES_DB: ${POSTGRES_DB:-blockpuzzle}
    volumes:
      - bp-postgres:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bp} -d $${POSTGRES_DB:-blockpuzzle}"]
      interval: 5s
      timeout: 5s
      retries: 12


volumes:
  bp-data:
  bp-postgres:
